<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator</title>
<style>
  :root {
    --bg: #1b1d21;
    --panel: #24272d;
    --screen: #14161a;
    --key: #2e323a;
    --key-hover: #3a3f49;
    --muted: #767c88;
    --text: #eef0f3;
    --accent: #f0a03c;
    --accent-hover: #f6b05a;
    --clear: #d9614f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'SF Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
    padding: 20px;
  }

  .calc {
    position: relative;
    width: 320px;
    background: var(--panel);
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    overflow: hidden;
  }

  .topbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }

  .hist-btn {
    height: auto;
    width: auto;
    padding: 8px 14px;
    font-size: 13px;
    border-radius: 12px;
    color: var(--muted);
    background: var(--key);
    letter-spacing: 0.5px;
  }
  .hist-btn:hover { background: var(--key-hover); color: var(--text); }

  .screen {
    background: var(--screen);
    border-radius: 16px;
    padding: 20px 18px;
    text-align: right;
    margin-bottom: 18px;
    overflow: hidden;
  }

  .history {
    color: var(--muted);
    font-size: 15px;
    min-height: 20px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result {
    color: var(--text);
    font-size: 44px;
    font-weight: 600;
    line-height: 1.1;
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  button {
    border: none;
    outline: none;
    cursor: pointer;
    font-family: inherit;
    height: 62px;
    border-radius: 16px;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    background: var(--key);
    transition: background 0.12s ease, transform 0.05s ease;
  }

  button:hover { background: var(--key-hover); }
  button:active { transform: scale(0.95); }
  button:focus-visible { box-shadow: 0 0 0 3px var(--accent); }

  .op {
    color: var(--accent);
    font-weight: 600;
  }

  .op.active {
    background: var(--accent);
    color: #1b1d21;
  }

  .fn {
    color: var(--muted);
    font-size: 19px;
  }

  .clear { color: var(--clear); }

  .equals {
    background: var(--accent);
    color: #1b1d21;
    font-weight: 700;
  }
  .equals:hover { background: var(--accent-hover); }

  .span-2 { grid-column: span 2; }

  .panel {
    position: absolute;
    inset: 0;
    background: var(--panel);
    padding: 22px;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .panel.open { transform: translateY(0); }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .panel-title {
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
    margin-right: auto;
    letter-spacing: 0.5px;
  }
  .panel-clear, .panel-close {
    height: auto;
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 10px;
    background: var(--key);
  }
  .panel-clear { color: var(--clear); }
  .panel-close { color: var(--muted); }

  .panel-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .panel-item {
    background: var(--key);
    border-radius: 12px;
    padding: 12px 14px;
    text-align: right;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .panel-item:hover { background: var(--key-hover); }
  .panel-item .pi-expr {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .panel-item .pi-res {
    color: var(--text);
    font-size: 22px;
    font-weight: 600;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .panel-empty {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    margin-top: 40px;
  }
</style>
</head>
<body>
  <div class="calc">
    <div class="topbar">
      <button class="hist-btn" id="histBtn">🕘 Riwayat</button>
    </div>
    <div class="screen">
      <div class="history" id="history"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys">
      <button class="fn clear" data-action="clear">AC</button>
      <button class="fn" data-action="delete">⌫</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="÷">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="×">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="−">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="span-2" data-num="0">0</button>
      <button data-action="decimal">,</button>
      <button class="equals" data-action="equals">=</button>
    </div>

    <div class="panel" id="panel">
      <div class="panel-head">
        <span class="panel-title">Riwayat</span>
        <button class="panel-clear" id="clearHist">Hapus</button>
        <button class="panel-close" id="closePanel">✕</button>
      </div>
      <div class="panel-list" id="panelList"></div>
    </div>
  </div>

<script>
  const resultEl = document.getElementById('result');
  const historyEl = document.getElementById('history');

  const panel = document.getElementById('panel');
  const panelList = document.getElementById('panelList');

  let current = '0';     // angka yang sedang diketik
  let previous = null;   // angka sebelumnya
  let operator = null;   // operator aktif
  let justEvaluated = false;
  let history = [];      // riwayat perhitungan

  const opSymbols = { '+': '+', '−': '-', '×': '×', '÷': '÷' };

  function format(n) {
    if (n === 'Error') return 'Error';
    const num = parseFloat(n);
    if (!isFinite(num)) return 'Error';
    // batasi panjang biar tetap muat di layar
    let str = String(n);
    if (str.length > 12 && !str.includes('e')) {
      str = num.toPrecision(10).replace(/\.?0+$/, '');
    }
    return str.replace('.', ',');
  }

  function updateDisplay() {
    resultEl.textContent = format(current);
    if (operator && previous !== null) {
      historyEl.textContent = format(previous) + ' ' + operator;
    } else {
      historyEl.textContent = '';
    }
    document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    if (operator && !justEvaluated) {
      const active = document.querySelector(`[data-op="${operator}"]`);
      if (active) active.classList.add('active');
    }
  }

  function inputNumber(n) {
    if (justEvaluated) { current = n; justEvaluated = false; }
    else if (current === '0') { current = n; }
    else { current += n; }
    updateDisplay();
  }

  function inputDecimal() {
    if (justEvaluated) { current = '0.'; justEvaluated = false; }
    else if (!current.includes('.')) { current += '.'; }
    updateDisplay();
  }

  function chooseOperator(op) {
    if (operator && previous !== null && !justEvaluated) {
      compute();
    }
    previous = current;
    operator = op;
    justEvaluated = true; // angka berikutnya menimpa
    updateDisplay();
  }

  function compute() {
    if (operator === null || previous === null) return;
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let res;
    switch (operator) {
      case '+': res = a + b; break;
      case '−': res = a - b; break;
      case '×': res = a * b; break;
      case '÷': res = b === 0 ? 'Error' : a / b; break;
    }
    current = res === 'Error' ? 'Error' : String(res);
    previous = null;
    operator = null;
  }

  function equals() {
    if (operator === null) return;
    const expr = format(previous) + ' ' + operator + ' ' + format(current);
    compute();
    justEvaluated = true;
    resultEl.textContent = format(current);
    historyEl.textContent = expr + ' =';
    document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    if (current !== 'Error') {
      history.unshift({ expr: expr, res: format(current) });
      if (history.length > 50) history.pop();
      renderHistory();
    }
  }

  function renderHistory() {
    if (history.length === 0) {
      panelList.innerHTML = '<div class="panel-empty">Belum ada perhitungan</div>';
      return;
    }
    panelList.innerHTML = '';
    history.forEach(h => {
      const item = document.createElement('div');
      item.className = 'panel-item';
      item.innerHTML = '<div class="pi-expr">' + h.expr + ' =</div>' +
                       '<div class="pi-res">' + h.res + '</div>';
      item.addEventListener('click', () => {
        current = h.res.replace(',', '.');
        previous = null; operator = null; justEvaluated = true;
        updateDisplay();
        panel.classList.remove('open');
      });
      panelList.appendChild(item);
    });
  }

  function clearAll() {
    current = '0'; previous = null; operator = null; justEvaluated = false;
    updateDisplay();
  }

  function del() {
    if (justEvaluated) return;
    current = current.length > 1 ? current.slice(0, -1) : '0';
    updateDisplay();
  }

  function percent() {
    current = String(parseFloat(current) / 100);
    updateDisplay();
  }

  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.num !== undefined) inputNumber(b.dataset.num);
    else if (b.dataset.op) chooseOperator(b.dataset.op);
    else switch (b.dataset.action) {
      case 'clear': clearAll(); break;
      case 'delete': del(); break;
      case 'percent': percent(); break;
      case 'decimal': inputDecimal(); break;
      case 'equals': equals(); break;
    }
  });

  // panel riwayat
  document.getElementById('histBtn').addEventListener('click', () => {
    renderHistory();
    panel.classList.add('open');
  });
  document.getElementById('closePanel').addEventListener('click', () => {
    panel.classList.remove('open');
  });
  document.getElementById('clearHist').addEventListener('click', () => {
    history = [];
    renderHistory();
  });

  // dukungan keyboard
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (k >= '0' && k <= '9') inputNumber(k);
    else if (k === '.' || k === ',') inputDecimal();
    else if (k === '+') chooseOperator('+');
    else if (k === '-') chooseOperator('−');
    else if (k === '*') chooseOperator('×');
    else if (k === '/') { e.preventDefault(); chooseOperator('÷'); }
    else if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); }
    else if (k === 'Backspace') del();
    else if (k === 'Escape') clearAll();
    else if (k === '%') percent();
  });

  updateDisplay();
</script>
</body>
</html>
